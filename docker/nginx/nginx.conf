worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"request_id":"$effective_request_id"}';
    access_log /dev/stdout json;
    sendfile on;
    server_tokens off;
    client_max_body_size 1m;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
