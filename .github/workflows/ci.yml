name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: laravel_testing
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: laravel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laravel -d laravel_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_IMAGE: laravel-api:test
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: laravel_testing
      DB_USERNAME: laravel
      DB_PASSWORD: laravel
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose model
        run: |
          docker compose config --quiet
          APP_KEY='base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' \
          APP_URL='https://api.example.test' \
          DB_HOST='postgres.example.test' DB_DATABASE='app' DB_USERNAME='app' DB_PASSWORD='placeholder' \
          REDIS_HOST='redis.example.test' REDIS_PASSWORD='placeholder' \
          JWT_ISSUER='https://api.example.test' JWT_AUDIENCE='app' \
          MAIL_HOST='smtp.example.test' \
          JWT_PUBLIC_KEY_FILE='/tmp/jwt-public.pem' JWT_PRIVATE_KEY_FILE='/tmp/jwt-private.pem' \
          docker compose -f compose.production.yaml config --quiet

      - name: Build PHP test image
        run: docker build --target test --tag "$TEST_IMAGE" .

      - name: Build and inspect production image
        run: |
          docker build --target production --tag laravel-api:production .
          docker run --rm --entrypoint sh laravel-api:production -lc \
            'test ! -e .env && test ! -e storage/keys/jwt-private.pem && test ! -e storage/keys/jwt-public.pem'
          docker build --file docker/nginx/Dockerfile --target production --tag laravel-api-nginx:production .
          docker run --rm --entrypoint sh laravel-api-nginx:production -lc \
            'test -f /var/www/html/public/index.php'

      - name: Validate Composer metadata
        run: docker run --rm "$TEST_IMAGE" composer validate --strict --no-interaction

      - name: Check formatting
        run: docker run --rm "$TEST_IMAGE" vendor/bin/pint --test

      - name: Run static analysis
        run: docker run --rm "$TEST_IMAGE" vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Validate OpenAPI export
        run: >-
          docker run --rm --network host
          -e APP_ENV -e APP_KEY
          -e DB_CONNECTION -e DB_HOST -e DB_PORT -e DB_DATABASE -e DB_USERNAME -e DB_PASSWORD
          "$TEST_IMAGE" sh -lc
          'php artisan scramble:export --path=/tmp/openapi.json --no-interaction
          && php -r "json_decode(file_get_contents(\"/tmp/openapi.json\"), true, 512, JSON_THROW_ON_ERROR);"
          && cmp /tmp/openapi.json docs/openapi/openapi.json'

      - name: Validate migrations and seeders
        run: >-
          docker run --rm --network host
          -e APP_ENV -e APP_KEY
          -e DB_CONNECTION -e DB_HOST -e DB_PORT -e DB_DATABASE -e DB_USERNAME -e DB_PASSWORD
          -e REDIS_CLIENT -e REDIS_HOST -e REDIS_PORT
          "$TEST_IMAGE" sh -lc
          'php artisan migrate:fresh --seed --force
          && php artisan migrate:rollback --force
          && php artisan migrate:fresh --seed --force'

      - name: Run tests with coverage
        run: >-
          docker run --rm --network host
          -e APP_ENV -e APP_KEY
          -e DB_CONNECTION -e DB_HOST -e DB_PORT -e DB_DATABASE -e DB_USERNAME -e DB_PASSWORD
          -e REDIS_CLIENT -e REDIS_HOST -e REDIS_PORT
          -e CACHE_STORE -e QUEUE_CONNECTION -e SESSION_DRIVER -e MAIL_MAILER
          "$TEST_IMAGE" php artisan test --parallel --coverage --min=85

      - name: Run project consistency checks
        run: |
          sh scripts/check-project.sh docs
          sh scripts/check-project.sh readme
          sh scripts/check-project.sh traces
          sh scripts/check-project.sh rules
          sh scripts/check-project.sh skills

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer audit --locked --no-interaction

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
